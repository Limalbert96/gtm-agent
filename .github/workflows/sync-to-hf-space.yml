name: Sync to Hugging Face Space

# Mirrors this repo into a Hugging Face Docker Space on every push, which makes
# the Space rebuild and redeploy. Configure (see README, "Auto-sync from GitHub"):
#   - Repository variable HF_SPACE  = "<owner>/<space-name>"
#   - Repository variable HF_USER   = your Hugging Face username (the token owner)
#   - Repository secret   HF_TOKEN  = a Hugging Face access token with WRITE scope
#
# Until HF_SPACE and HF_USER exist, the job SKIPS rather than fails — so hosting
# elsewhere (Render) doesn't leave a red X on every push, and HF stays a one-step
# fallback: set the two variables and the secret, and syncing resumes.
#
# The push is a force push: the Space is a mirror of this repo, so edits made in
# the Space's web UI are overwritten on the next sync. Make changes here, not there.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: hf-space-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # No Space configured -> nothing to mirror. Skipped, not failed. (The secrets
    # context can't be read in a job-level `if`, so HF_TOKEN is checked below.)
    if: vars.HF_SPACE != '' && vars.HF_USER != ''
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # The Space needs real history, not a shallow clone, to accept the push.
          fetch-depth: 0
          lfs: true

      - name: Validate configuration
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bad=0
          printf '%s' "$HF_SPACE" | grep -q '^[^/][^/]*/[^/][^/]*$' \
            || { echo "::error::HF_SPACE must look like '<owner>/<space-name>', got '$HF_SPACE'."; bad=1; }
          [ -n "$HF_TOKEN" ] \
            || { echo "::error::HF_SPACE/HF_USER are set but the HF_TOKEN secret is missing (need an HF token with write scope)."; bad=1; }
          exit $bad

      - name: Refuse to sync if secrets are tracked
        run: |
          # A Space can be public. Never let a real env file or key ride along.
          leaked=$(git ls-files \
            | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$|\.pem$|\.p12$|(^|/)id_(rsa|ed25519)$|(^|/)playbooks/private/' \
            || true)
          if [ -n "$leaked" ]; then
            echo "::error::Refusing to push — these tracked files look like secrets:"
            printf '%s\n' "$leaked"
            echo "Untrack them (git rm --cached <file>) and confirm .gitignore covers them."
            exit 1
          fi
          echo "OK: no tracked secret files."

      - name: Verify Space metadata block
        run: |
          # Hugging Face only reads the YAML front-matter if it starts at byte 0.
          if [ "$(head -n 1 README.md)" != "---" ]; then
            echo "::error::README.md must begin with the Space front-matter block ('---') on line 1."
            exit 1
          fi
          grep -qE '^sdk:[[:space:]]*docker[[:space:]]*$' README.md \
            || { echo "::error::README.md front-matter must set 'sdk: docker'."; exit 1; }
          grep -qE '^app_port:[[:space:]]*7860[[:space:]]*$' README.md \
            || { echo "::error::README.md front-matter must set 'app_port: 7860' to match the Dockerfile."; exit 1; }
          echo "OK: Space metadata present."

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_USER: ${{ vars.HF_USER }}
        run: |
          # HEAD:refs/heads/main works whether this repo's branch is main or master;
          # a Space's default branch is always main.
          git push --force \
            "https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" \
            HEAD:refs/heads/main

      - name: Where to watch the build
        if: success()
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          echo "Pushed. Build logs: https://huggingface.co/spaces/$HF_SPACE?logs=build"
          echo "App: https://huggingface.co/spaces/$HF_SPACE"
