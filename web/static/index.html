<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTM Lifecycle Assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1c2024;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-soft: #eaf1ff;
    --user-bubble: #2f6feb;
    --user-text: #ffffff;
    --assistant-bubble: #f1f3f5;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
      Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* Top bar */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .title {
    font-weight: 650;
    font-size: 16px;
    letter-spacing: -0.01em;
    margin-right: auto;
  }
  .title .dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
  }
  select {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 10px;
    max-width: 240px;
  }
  .badge {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #d6e3ff;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.hidden { visibility: hidden; }

  /* Transcript */
  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 76%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 5px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 5px;
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin: 3px 4px 0;
  }
  .row.user .meta { text-align: right; }

  .empty {
    color: var(--muted);
    text-align: center;
    margin: auto;
    max-width: 360px;
  }

  .typing { color: var(--muted); font-style: italic; }

  /* Composer */
  .composer {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    background: var(--panel);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    background: var(--accent-soft);
    border: 1px solid #d6e3ff;
    color: #1e4fb0;
    padding: 4px 6px 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
    max-width: 100%;
  }
  .chip button {
    border: none;
    background: transparent;
    color: #1e4fb0;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 50%;
  }
  .chip button:hover { background: #d6e3ff; }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    height: 42px;
    width: 42px;
    font-size: 18px;
    cursor: pointer;
    color: var(--muted);
    flex: none;
  }
  .icon-btn:hover { background: var(--bg); }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 13px;
    max-height: 160px;
    min-height: 42px;
    background: var(--panel);
  }
  textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .send {
    border: none;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    border-radius: 12px;
    padding: 0 18px;
    height: 42px;
    cursor: pointer;
    flex: none;
  }
  .send:disabled { opacity: 0.5; cursor: default; }

  .hint { font-size: 11px; color: var(--muted); margin: 8px 2px 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><span class="dot"></span>GTM Lifecycle Assistant</div>
    <select id="account" aria-label="Account focus">
      <option value="">All accounts</option>
    </select>
    <span id="agentBadge" class="badge hidden">gtm_coordinator</span>
  </header>

  <div class="transcript" id="transcript">
    <div class="empty" id="empty">
      Ask about pipeline, technical validation, or adoption &amp; renewal across
      your accounts. Pick an account above to focus the conversation, or attach a
      transcript / document to ground the answer.
    </div>
  </div>

  <div class="composer">
    <div id="chipWrap"></div>
    <div class="input-row">
      <input type="file" id="fileInput" style="display:none"
             accept=".txt,.md,.csv,.json,.log,.pdf,.docx,text/*" />
      <button class="icon-btn" id="attachBtn" title="Attach a document">&#128206;</button>
      <textarea id="input" rows="1" placeholder="Message the GTM assistant..."></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // A fresh session id per page load; reused for the whole conversation.
  var SESSION_ID = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);

  var transcriptEl = document.getElementById("transcript");
  var emptyEl = document.getElementById("empty");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var accountEl = document.getElementById("account");
  var badgeEl = document.getElementById("agentBadge");
  var fileInput = document.getElementById("fileInput");
  var attachBtn = document.getElementById("attachBtn");
  var chipWrap = document.getElementById("chipWrap");

  // Text extracted from an uploaded file, sent with the NEXT message then cleared.
  var pendingFile = null; // { filename, file_text, chars }
  var busy = false;

  // ---- Account selector -----------------------------------------------------
  fetch("/api/accounts")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      (data.accounts || []).forEach(function (a) {
        var opt = document.createElement("option");
        opt.value = a.account_id;
        opt.textContent = a.name + (a.stage ? " — " + a.stage : "");
        accountEl.appendChild(opt);
      });
    })
    .catch(function () { /* selector just stays at "All accounts" */ });

  // ---- Transcript rendering -------------------------------------------------
  function addMessage(role, text, agentName) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }

    var row = document.createElement("div");
    row.className = "row " + role;

    var wrap = document.createElement("div");

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (role === "assistant" && agentName) {
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = agentName;
      wrap.appendChild(meta);
    }

    row.appendChild(wrap);
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    return bubble;
  }

  function setBadge(agentName) {
    if (!agentName) return;
    badgeEl.textContent = agentName;
    badgeEl.classList.remove("hidden");
  }

  // ---- File attach ----------------------------------------------------------
  attachBtn.addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var fd = new FormData();
    fd.append("file", f);
    renderChip(f.name, true);
    fetch("/api/upload", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        pendingFile = data;
        renderChip(data.filename, false, data.chars);
      })
      .catch(function () {
        pendingFile = null;
        clearChip();
      });
    fileInput.value = "";
  });

  function renderChip(name, loading, chars) {
    chipWrap.innerHTML = "";
    var chip = document.createElement("span");
    chip.className = "chip";
    var label = document.createElement("span");
    label.textContent = loading
      ? name + " (reading...)"
      : name + (typeof chars === "number" ? " (" + chars + " chars)" : "");
    chip.appendChild(label);
    if (!loading) {
      var x = document.createElement("button");
      x.textContent = "×";
      x.title = "Remove attachment";
      x.addEventListener("click", clearChip);
      chip.appendChild(x);
    }
    chipWrap.appendChild(chip);
  }

  function clearChip() {
    pendingFile = null;
    chipWrap.innerHTML = "";
  }

  // ---- Send -----------------------------------------------------------------
  function send() {
    if (busy) return;
    var text = inputEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    inputEl.value = "";
    autosize();

    var payload = {
      session_id: SESSION_ID,
      message: text,
      account_id: accountEl.value || null,
      file_text: pendingFile ? pendingFile.file_text : null
    };
    clearChip(); // attachment rides along with this one message only

    busy = true;
    sendBtn.disabled = true;
    var placeholder = addMessage("assistant", "Thinking...", null);
    placeholder.classList.add("typing");

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        placeholder.classList.remove("typing");
        placeholder.textContent = data.reply || "(no reply)";
        var meta = placeholder.parentNode.querySelector(".meta");
        if (!meta) {
          meta = document.createElement("div");
          meta.className = "meta";
          placeholder.parentNode.appendChild(meta);
        }
        meta.textContent = data.agent || "gtm_coordinator";
        setBadge(data.agent);
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      })
      .catch(function (err) {
        placeholder.classList.remove("typing");
        placeholder.textContent = "Network error: " + err;
      })
      .finally(function () {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      });
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // ---- Textarea autosize ----------------------------------------------------
  function autosize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }
  inputEl.addEventListener("input", autosize);

  inputEl.focus();
})();
</script>
</body>
</html>
